<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 줄자+약식 평면</title>
<link rel="stylesheet" href="base.css">
<style>
.in{max-width:980px;margin:0 auto;padding:0 16px 22px}
header{display:flex;justify-content:space-between;align-items:center;min-height:60px}
header a.nav{font-size:14px;font-weight:700;min-height:48px;display:flex;align-items:center}
h1{font-size:28px;line-height:1.35;font-weight:900;letter-spacing:-.02em;margin-top:18px}
.lead{color:var(--muted);margin-top:8px}
.plan{margin-top:16px;background:#fff;border:1.5px solid var(--ink);padding:12px}
.plan svg{display:block;width:100%;height:auto}
.plan p{font-size:12px;color:var(--muted);margin-top:6px}
@media(min-width:860px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}h1{font-size:42px}}
</style></head><body>
<div class="demo">포트폴리오용 가상 업체 샘플 · 실제 업체가 아닙니다</div>
<div class="ruler" aria-hidden="true"></div>
<div class="in">
<header><a class="logo" href="#">담온 인테리어<small>가상</small></a><a class="nav" href="#">시공 사례</a></header>
<div class="grid"><div>
<span class="mask">실측 3,240 mm</span>
<h1>실측한 그대로 견적하고,<br>견적서대로 시공합니다</h1>
<p class="lead">먼저 현장에 가서 치수와 배관·전기를 직접 잽니다. 그 숫자로 견적서를 씁니다.</p>
<div class="acts"><a class="btn fill" href="#">실측 날짜 잡기</a><a class="btn line" href="#">시공 사례 보기</a></div>
</div>
<figure class="plan"><svg viewBox="0 0 320 170" role="img" aria-label="거실 약식 평면에 실측 치수 3,240과 4,150, 콘센트 위치 표시">
<g fill="none" stroke="#1F1F1D" stroke-width="3"><path d="M20 20h280v130H20z"/></g><path d="M120 150v-0" />
<g stroke="#1F1F1D" stroke-width="1"><path d="M20 162h280M20 158v8M300 158v8M308 20v130M304 20h8M304 150h8"/></g>
<rect x="128" y="154" width="64" height="16" fill="#F7E3A1"/><text x="160" y="166" font-size="11" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR',sans-serif">4,150</text>
<rect x="276" y="76" width="44" height="16" fill="#F7E3A1"/><text x="298" y="88" font-size="11" font-weight="700" text-anchor="middle" font-family="'Noto Sans KR',sans-serif">3,240</text>
<g fill="#1F1F1D"><rect x="60" y="16" width="10" height="8"/><rect x="220" y="146" width="10" height="8"/></g>
<text x="40" y="48" font-size="11" fill="#55534D" font-family="'Noto Sans KR',sans-serif">거실 · 콘센트 2</text>
</svg><p>실측 메모 예시 (가상 · 단위 mm)</p></figure>
</div></div>
</body></html>
