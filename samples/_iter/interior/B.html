<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B 사진+줄자</title>
<link rel="stylesheet" href="base.css">
<style>
header{display:flex;justify-content:space-between;align-items:center;min-height:60px;max-width:980px;margin:0 auto;padding:0 16px}
header a.nav{font-size:14px;font-weight:700;min-height:48px;display:flex;align-items:center}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.ph .ruler{position:absolute;left:0;right:0;bottom:0}
.ph .mask{position:absolute;right:16px;bottom:44px}
.in{max-width:980px;margin:0 auto;padding:20px 16px 22px}
h1{font-size:28px;line-height:1.35;font-weight:900;letter-spacing:-.02em}
.lead{color:var(--muted);margin-top:8px}
@media(min-width:860px){h1{font-size:42px}.ph img{aspect-ratio:21/9}}
</style></head><body>
<div class="demo">포트폴리오용 가상 업체 샘플 · 실제 업체가 아닙니다</div>
<header><a class="logo" href="#">담온 인테리어<small>가상</small></a><a class="nav" href="#">시공 사례</a></header>
<div class="ph"><img src="../../img/interior/1.jpg" alt=""><span class="mask">거실 폭 4,150 mm</span><div class="ruler" aria-hidden="true"></div></div>
<div class="in">
<h1>실측한 그대로 견적하고,<br>견적서대로 시공합니다</h1>
<p class="lead">먼저 현장에 가서 치수와 배관·전기를 직접 잽니다.</p>
<div class="acts"><a class="btn fill" href="#">실측 날짜 잡기</a><a class="btn line" href="#">시공 사례 보기</a></div>
</div>
</body></html>
