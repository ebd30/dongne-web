<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 모눈 계단</title>
<link rel="stylesheet" href="base.css">
<style>
.note{background:var(--motif-grid),var(--white);border-bottom:2px solid var(--ink)}
.in{max-width:980px;margin:0 auto;padding:0 16px 22px}
header{display:flex;justify-content:space-between;align-items:center;min-height:64px}
header a.nav{font-size:14px;font-weight:700;min-height:48px;display:flex;align-items:center}
h1{font-size:30px;line-height:1.3;font-weight:900;letter-spacing:-.02em;margin-top:6px}
.lead{color:var(--muted);margin-top:8px}
.stair{display:block;width:100%;height:auto;margin-top:14px}
@media(min-width:860px){.in{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end}header{grid-column:1/-1}h1{font-size:44px}}
</style></head><body>
<div class="demo">포트폴리오용 가상 학원 샘플 · 실제 학원이 아닙니다</div>
<div class="note"><div class="in">
<header><a class="logo" href="#">한걸음 수학<small>가상</small></a><a class="nav" href="#">시간표·교습비</a></header>
<div>
<h1>수학이 싫은 아이도 한 계단씩 다시</h1>
<p class="lead">중1~고2, 한 반 6명. 어느 계단에서 멈췄는지 먼저 찾고, 그 자리부터 다시 오릅니다.</p>
<div class="acts"><a class="btn fill" href="#">우리 아이 첫 계단 찾기 (40분)</a><a class="btn line" href="#">시간표·교습비 보기</a></div>
</div>
<svg class="stair" viewBox="0 0 340 170" role="img" aria-label="단원 계단: 정수와 유리수, 일차방정식, 일차함수에서 멈춤 표시, 그다음 이차방정식">
<g fill="none" stroke="#134B5F" stroke-width="2.5"><path d="M10 160h80v-35h80v-35h80v-35h80"/></g>
<g font-family="'Noto Sans KR',sans-serif" font-size="13" fill="#134B5F" font-weight="700">
<text x="16" y="150">정수와 유리수</text><text x="96" y="115">일차방정식</text><text x="176" y="80">일차함수</text><text x="256" y="45">이차방정식</text></g>
<g fill="#A4521F" font-family="'Noto Sans KR',sans-serif" font-size="11"><text x="72" y="168">✓</text><text x="152" y="133">✓</text></g>
<ellipse cx="206" cy="76" rx="38" ry="15" fill="none" stroke="#C0392B" stroke-width="2"/>
<text x="176" y="104" font-family="'Noto Sans KR',sans-serif" font-size="12" font-weight="700" fill="#C0392B">여기서 멈췄어요</text>
</svg>
</div></div>
</body></html>
