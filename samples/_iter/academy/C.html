<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 진단지 먼저</title>
<link rel="stylesheet" href="base.css">
<style>
.in{max-width:980px;margin:0 auto;padding:0 16px 22px}
header{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-bottom:2px solid var(--ink)}
header a.nav{font-size:14px;font-weight:700;min-height:48px;display:flex;align-items:center}
.paper{margin-top:16px;background:var(--motif-grid),#fff;border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px}
.paper p{font-size:12px;color:var(--muted)}
.paper ol{padding:0;list-style:none;margin-top:4px}
.paper li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-weight:700;font-size:15px}
.paper .x{color:var(--red)}
.paper .x b{outline:2px solid var(--red);border-radius:50%;padding:0 6px}
.paper .o{color:var(--accent)}
h1{font-size:28px;line-height:1.3;font-weight:900;letter-spacing:-.02em;margin-top:18px}
.lead{color:var(--muted);margin-top:8px}
@media(min-width:860px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}h1{font-size:42px}}
</style></head><body>
<div class="demo">포트폴리오용 가상 학원 샘플 · 실제 학원이 아닙니다</div>
<div class="in">
<header><a class="logo" href="#">한걸음 수학<small>가상</small></a><a class="nav" href="#">시간표·교습비</a></header>
<div class="grid">
<div class="paper"><p>40분 진단지 예시 (가상 · 중2)</p><ol>
<li><span>정수와 유리수</span><span class="o">✓</span></li>
<li><span>일차방정식</span><span class="o">✓</span></li>
<li class="x"><span>일차함수 그래프</span><b>3/8</b></li>
<li><span>연립방정식</span><span>–</span></li></ol></div>
<div>
<h1>수학이 싫은 아이도 한 계단씩 다시</h1>
<p class="lead">어느 계단에서 멈췄는지 먼저 찾고, 그 자리부터 다시 오릅니다. 중1~고2, 한 반 6명.</p>
<div class="acts"><a class="btn fill" href="#">우리 아이 첫 계단 찾기 (40분)</a><a class="btn line" href="#">시간표·교습비 보기</a></div>
</div></div></div>
</body></html>
