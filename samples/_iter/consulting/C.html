<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 질문 체크</title>
<link rel="stylesheet" href="base.css">
<style>
.in{max-width:980px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-bottom:2px solid var(--ink)}
header a.nav{font-size:14px;font-weight:700;color:var(--green);min-height:48px;display:flex;align-items:center}
.q{margin-top:20px;background:var(--motif-margin),var(--motif-ledger),#fff;border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 14px 14px 38px;line-height:32px}
.q p{font-size:13px;color:var(--muted)}
.q li{list-style:none;font-size:17px;font-weight:700}
.q li::before{content:"□ ";color:var(--red)}
.q ul{padding:0}
h1{font-size:28px;line-height:1.35;font-weight:900;letter-spacing:-.02em;margin-top:22px}
.lead{color:var(--muted);margin-top:10px}
.acts{display:grid;gap:10px;margin-top:18px}
@media(min-width:860px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}h1{font-size:40px}}
</style></head><body>
<div class="demo">포트폴리오용 가상 회사 샘플 · 실제 회사가 아닙니다</div>
<div class="in">
<header><a class="logo" href="#">누리온 창업컨설팅<small>가상</small></a><a class="nav" href="#">상담 순서</a></header>
<div class="grid">
<div class="q"><p>사장님 장부에 바로 답이 있나요?</p><ul><li>지난달 남은 돈</li><li>가장 덜 남는 메뉴</li><li>다음 달 먼저 줄일 비용</li></ul></div>
<div>
<h1>가게의 <span class="hl">숫자</span>를 함께 읽고, 다음 한 걸음을 같이 정합니다</h1>
<p class="lead">세 칸이 비어 있어도 괜찮습니다. 첫 상담 30분 동안 같이 채웁니다.</p>
<div class="acts"><a class="btn fill" href="#">장부 들고 첫 상담 받기</a><a class="btn line" href="#">함께 읽는 순서 보기</a></div>
</div></div></div>
</body></html>
