<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B 로스팅 곡선</title>
<link rel="stylesheet" href="base.css">
<style>
.top{background:var(--ink);color:var(--kraft)}

.curve{display:block;width:100%;height:auto;margin-top:6px}

.body{max-width:980px;margin:0 auto;padding:18px 16px}
.lead{color:var(--muted)}

</style></head><body>
<div class="demo">포트폴리오용 가상 가게 샘플 · 실제 매장이 아닙니다</div>
<div class="top"><div class="in">

<svg class="curve" viewBox="0 0 340 150" role="img" aria-label="이번 주 로스팅 기록 곡선 예시: 12분에 볶기를 마침">
<g stroke="#5E4B3C" stroke-width="1"><path d="M20 130h310M20 20v110"/></g>
<path d="M20 60 C60 120 90 118 130 98 S230 46 300 34" fill="none" stroke="#E9DCC6" stroke-width="3"/>

</svg>

<div class="body">
<p class="lead">매일 아침 문 열기 전에 이번 주 원두를 확인해요. 볶은 날은 봉투에 도장으로 찍어 둡니다.</p>
<div class="acts"><a class="btn fill" href="#">이번 주 볶은 원두 보기</a><a class="btn line" href="#">찾아오는 길</a></div>
</div>
